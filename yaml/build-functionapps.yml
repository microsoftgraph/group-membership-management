parameters:
- name: functionApps
  type: object
- name: repoToCheckout
  type: string
- name: checkoutPath
  type: string
- name: dependsOn
  type: object
- name: condition
  type: object
- name: buildRelease
  type: boolean

stages:

- stage: Build_Functions
  dependsOn: ${{ parameters.dependsOn }}
  condition: ${{ parameters.condition }}

  jobs:
  - ${{ each app in parameters.functionApps }}:
      - job: Build_${{ app.function.name }}
        ${{ if parameters.buildRelease }}:
          strategy:
              maxParallel: 2
              matrix:
                debug:
                  BuildConfiguration: debug
                release:
                  BuildConfiguration: release
        ${{ else }}:
          variables:
            BuildConfiguration: 'debug'

        steps:

        - ${{ if ne(parameters.repoToCheckout, '') }}:
          - checkout: ${{ parameters.repoToCheckout }}
            path: ${{ parameters.checkoutPath }}

        - task: UseDotNet@2
          inputs:
            packageType: 'sdk'
            useGlobalJson: true
            workingDirectory: 'Service\GroupMembershipManagement'

        - task: DotNetCoreCLI@2
          displayName: 'dotnet build ${{ app.function.name }} function'
          retryCountOnTaskFailure: 3
          inputs:
            command: build
            projects: 'Service/GroupMembershipManagement/Hosts/${{ app.function.name }}/Function/*.csproj'
            arguments: '--configuration $(buildConfiguration)'

        - task: DotNetCoreCLI@2
          displayName: 'dotnet test ${{ app.function.name }} function'
          retryCountOnTaskFailure: 3
          inputs:
            command: test
            projects: 'Service/GroupMembershipManagement/Hosts/${{ app.function.name }}/Services.Tests'
            arguments: '--configuration $(BuildConfiguration)
                        /p:CollectCoverage=true
                        /p:CoverletOutputFormat=cobertura
                        /p:threshold=${{ app.function.coverageThreshold }}
                        /p:thresholdType=line
                        /p:thresholdStat=total
                        /p:CoverletOutput=$(Build.SourcesDirectory)\TestResults\Coverage\${{ app.function.name }}\
                        /p:Exclude=[Repositories.*]*%2c[Entities]*%2c[*.Entities]*%2c[Models]*%2c[*.Models]*%2c[*.Tests]*%2c[*.Mocks]*%2c[Common.DependencyInjection]*%2c[Hosts.FunctionBase]*%2c[DIConcreteTypes]*%2c[Services.Contracts]*%2c[*.Services.Contracts]*%2c[*]*.*.Startup*%2c[*]*.*.Program
                        /p:ExcludeByAttribute=Obsolete%2cGeneratedCodeAttribute%2cCompilerGeneratedAttribute'          
          condition: and(succeeded(), eq(variables['BuildConfiguration'], 'debug'))

        - task: PublishCodeCoverageResults@1
          displayName: 'collect code coverage'
          inputs:
            codeCoverageTool: 'cobertura'
            summaryFileLocation: $(Build.SourcesDirectory)/TestResults/Coverage/${{ app.function.name }}/coverage.cobertura.xml
            reportDirectory: $(Build.SourcesDirectory)/TestResults/Coverage/${{ app.function.name }}/Reports
            failIfCoverageEmpty: false
          condition: and(succeeded(), eq(variables['BuildConfiguration'], 'debug'))

        - task: PowerShell@2
          displayName: 'Run dotnet package audit for ${{ app.function.name }}'
          retryCountOnTaskFailure: 3
          inputs:
            targetType: inline
            workingDirectory: 'Service/GroupMembershipManagement'
            script: |
              $projectPatterns = @(
                "Hosts/${{ app.function.name }}/Function/*.csproj"
                "Hosts/${{ app.function.name }}/Services.Tests/*.csproj"
              )

              $hasVulnerabilities = $false

              foreach ($projectPattern in $projectPatterns) {
                $projects = Get-ChildItem -Path $projectPattern -File -ErrorAction SilentlyContinue

                if (-not $projects) {
                  Write-Host "No projects found for pattern '$projectPattern', skipping."
                  continue
                }

                foreach ($project in $projects) {
                  Write-Host "Auditing vulnerable packages for $($project.FullName)"

                  $auditOutput = dotnet list $project.FullName package --vulnerable --include-transitive --format json 2>&1 | Out-String
                  $dotnetExitCode = $LASTEXITCODE

                  try {
                    $auditResult = $auditOutput | ConvertFrom-Json -Depth 100
                  } catch {
                    throw "dotnet package audit failed for '$($project.FullName)' (exit code $dotnetExitCode). Raw output:`n$auditOutput"
                  }

                  foreach ($projectResult in @($auditResult.projects)) {
                    foreach ($framework in @($projectResult.frameworks)) {
                      $packages = @()

                      if ($framework.topLevelPackages) {
                        $packages += @($framework.topLevelPackages)
                      }

                      if ($framework.transitivePackages) {
                        $packages += @($framework.transitivePackages)
                      }

                      $vulnerablePackages = @($packages | Where-Object {
                        $_ -and $_.vulnerabilities -and @($_.vulnerabilities).Count -gt 0
                      })

                      foreach ($package in $vulnerablePackages) {
                        foreach ($vulnerability in @($package.vulnerabilities)) {
                          $severity = if ($vulnerability.severity) { $vulnerability.severity } else { 'unknown' }
                          $advisoryUrl = if ($vulnerability.advisoryUrl) { $vulnerability.advisoryUrl } else { 'n/a' }

                          Write-Host "##vso[task.logissue type=error]$($projectResult.path) [$($framework.framework)] package '$($package.id)' version '$($package.resolvedVersion)' has a '$severity' severity vulnerability: $advisoryUrl"
                          $hasVulnerabilities = $true
                        }
                      }
                    }
                  }
                }
              }

              if ($hasVulnerabilities) {
                throw 'Vulnerable NuGet packages were found. See errors above for details.'
              }

              Write-Host 'No vulnerable NuGet packages found.'
              exit 0
            pwsh: true
          condition: and(succeeded(), eq(variables['BuildConfiguration'], 'debug'))

        - task: DotNetCoreCLI@2
          displayName: 'dotnet publish ${{ app.function.name }} function'
          inputs:
            command: publish
            arguments: '--configuration $(BuildConfiguration) --output ${{ app.function.name }} /p:AssemblyVersion=$(Build.BuildNumber)'
            projects: 'Service/GroupMembershipManagement/Hosts/${{ app.function.name }}/Function/*.csproj'
            publishWebProjects: false
            modifyOutputPath: false
            zipAfterPublish: false

        - task: ArchiveFiles@2
          displayName: 'archive ${{ app.function.name }} function'
          inputs:
            rootFolderOrFile: "$(System.DefaultWorkingDirectory)/${{ app.function.name }}"
            includeRootFolder: false
            archiveFile: "$(System.DefaultWorkingDirectory)/functions/${{ app.function.name }}.zip"

        - task: CopyFiles@2
          displayName: 'copy ${{ app.function.name }} function package'
          inputs:
            SourceFolder: $(System.DefaultWorkingDirectory)/functions
            Contents: ${{ app.function.name }}.zip
            TargetFolder: '$(build.artifactstagingdirectory)/function_packages/'

        - task: CopyFiles@2
          displayName: 'copy ${{ app.function.name }} function arm templates'
          inputs:
            SourceFolder: Service/GroupMembershipManagement/Hosts/${{ app.function.name }}
            Contents: '**\Infrastructure\**'
            TargetFolder: '$(build.artifactstagingdirectory)/functions_arm_templates/${{ app.function.name }}'

        - task: PublishBuildArtifacts@1
          displayName: 'publish functions artifacts'
          inputs:
            PathtoPublish: '$(build.artifactstagingdirectory)'
            ArtifactName: '$(Build.BuildNumber)_$(BuildConfiguration)'
