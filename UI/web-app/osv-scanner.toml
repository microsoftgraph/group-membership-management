# osv-scanner configuration for the GMM web-app lockfile scan.
# See: https://google.github.io/osv-scanner/configuration/
#
# Entries here should be TIME-BOXED and DOCUMENTED. The `ignoreUntil` date makes
# each suppression auto-expire so the finding re-surfaces and forces a revisit.
#
# Every other advisory reported against this lockfile is remediated by a real
# version bump. Override-based remediations are documented in package.json under
# `x-override-notes`; some fixes (e.g. react-router) are plain direct-dependency
# bumps instead.
#
# Prefer fixing over suppressing. Only add an [[IgnoredVulns]] entry when there is
# genuinely no installable fix, and always include an `ignoreUntil` date and an
# ACTION describing what unblocks the real fix.

